[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "san-coverage-plan"
version = "0.1.0"
description = "Map declared DNS/IP SANs to hosts and compute a bounded exact cost plan."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nripanka Das"}]
dependencies = []

[project.scripts]
san-coverage-plan = "san_coverage_plan:main"

[tool.setuptools]
py-modules = ["san_coverage_plan"]
